research_company_culture_task:
  description: >
    分析所提供的公司网站和招聘经理公司的域名 {company_domain}、
    描述 {company_description}。重点了解公司的文化、价值观和使命。
    确定网站上突出的独特卖点和具体项目或成就。
    编写一份报告总结这些见解，特别是如何在招聘信息中利用它们来吸引合适的候选人。
  expected_output: >
    一份详尽的报告，详细介绍公司的文化、价值观和使命，以及与职位相关的具体卖点。应包括将这些见解纳入招聘信息的建议。

research_role_requirements_task:
  description: >
    根据招聘经理的需求：{hiring_needs}，确定理想候选人应具备的关键技能、经验和素质。考虑公司当前的项目、竞争格局和行业趋势。
    准备一份符合公司需求和价值观的推荐职位要求和资格清单。
  expected_output: >
    一份针对理想候选人的推荐技能、经验和素质的列表，与公司文化、正在进行的项目和具体职位的要求相一致。

draft_job_posting_task:
  description: >
    为招聘经理描述的职位起草招聘启事：{hiring_needs}。
    使用 {company_description} 上的见解，首先进行引人入胜的介绍，
    然后是详细的职位描述、职责以及所需的技能和资格。
    确保语气符合公司的文化，并融入公司提供的任何独特福利或机会。具体福利：{specific_benefits}。
  expected_output: >
    一份详细、引人入胜的招聘启事，包括简介、职位描述、职责、要求和独特的公司福利。语气应与公司的文化和价值观产生共鸣，旨在吸引合适的候选人。

review_and_edit_job_posting_task:
  description: >
    审查职位 {hiring_needs} 的招聘启事草稿。检查其清晰度、参与度、语法准确性以及是否符合公司的文化和价值观。
    编辑和完善内容，确保其直接针对所需候选人，并准确反映该职位的独特优势和机会。提供反馈，以进行任何必要的修改。
  expected_output: >
    一份精美、无误的招聘启事，内容清晰、引人入胜，与公司文化和价值观完美契合。关于潜在改进的反馈和最终发布的批准。采用 markdown 格式。

industry_analysis_task:
  description: >
    对与公司域名 {company_domain} 相关的行业进行深入分析。
    利用市场报告、最新发展和专家意见，调查行业内的当前趋势、挑战和机遇。评估这些因素如何影响所招聘的职位以及该职位对潜在候选人的整体吸引力。
    考虑如何利用公司在该行业中的地位及其对这些趋势的反应来吸引顶尖人才。
    在您的报告中包括该职位如何有助于应对行业挑战或抓住机遇。
  expected_output: >
    一份详细的分析报告，确定与公司领域和特定职位相关的主要行业趋势、挑战和机遇。该报告应提供战略见解，将职位和公司定位为对潜在候选人有吸引力的选择。
